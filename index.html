<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple AI Chatbot</title>
    <meta name="description" content="A simple AI chatbot with a clean chat interface">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f13;
            --bg-secondary: #1a1a24;
            --bg-chat: #13131b;
            --surface: #1e1e2e;
            --surface-hover: #252538;
            --accent: #7c5bf5;
            --accent-glow: rgba(124, 91, 245, 0.25);
            --accent-light: #9b7eff;
            --text-primary: #e8e6f0;
            --text-secondary: #8a879a;
            --text-muted: #5a576a;
            --bot-bubble: #1e1e2e;
            --user-bubble: linear-gradient(135deg, #7c5bf5, #6344d0);
            --border: rgba(255, 255, 255, 0.06);
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }

        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(124, 91, 245, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(99, 68, 208, 0.06) 0%, transparent 50%),
                var(--bg-primary);
        }

        .chat-container {
            width: 100%;
            max-width: 520px;
            height: 96vh;
            max-height: 780px;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        /* Header */
        .chat-header {
            padding: 18px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .bot-avatar {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: var(--user-bubble);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 16px var(--accent-glow);
            flex-shrink: 0;
        }

        .header-info h1 {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .header-info .status {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 6px rgba(52, 211, 153, 0.5);
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Messages area */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 20px 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: var(--bg-chat);
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar {
            width: 5px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 10px;
        }

        /* Message bubbles */
        .message {
            display: flex;
            gap: 10px;
            max-width: 82%;
            animation: msg-in 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes msg-in {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.bot {
            align-self: flex-start;
        }

        .msg-avatar {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .message.bot .msg-avatar {
            background: var(--surface);
            border: 1px solid var(--border);
        }

        .message.user .msg-avatar {
            background: var(--surface);
            border: 1px solid var(--border);
        }

        .bubble {
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.55;
            letter-spacing: 0.01em;
        }

        .message.bot .bubble {
            background: var(--bot-bubble);
            border: 1px solid var(--border);
            border-bottom-left-radius: 6px;
            color: var(--text-primary);
        }

        .message.user .bubble {
            background: var(--user-bubble);
            border-bottom-right-radius: 6px;
            color: #fff;
            box-shadow: 0 2px 12px var(--accent-glow);
        }

        /* Typing indicator */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            gap: 10px;
            max-width: 82%;
            animation: msg-in 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .typing-indicator.visible {
            display: flex;
        }

        .typing-indicator .msg-avatar {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .typing-dots {
            padding: 12px 18px;
            background: var(--bot-bubble);
            border: 1px solid var(--border);
            border-radius: 16px;
            border-bottom-left-radius: 6px;
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: bounce 1.4s ease-in-out infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* Input area */
        .input-area {
            padding: 16px 20px 20px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 6px 6px 6px 18px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: rgba(124, 91, 245, 0.4);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        #messageInput {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            padding: 8px 0;
            min-width: 0;
        }

        #messageInput::placeholder {
            color: var(--text-muted);
        }

        #sendBtn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: none;
            background: var(--user-bubble);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
            box-shadow: 0 2px 8px var(--accent-glow);
        }

        #sendBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        #sendBtn:active {
            transform: scale(0.95);
        }

        #sendBtn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        #sendBtn svg {
            width: 18px;
            height: 18px;
        }

        /* Timestamp group */
        .time-stamp {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin: 12px 0 8px;
        }

        /* Responsive */
        @media (max-width: 560px) {
            .chat-container {
                max-width: 100%;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
                border: none;
            }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- Header -->
    <div class="chat-header">
        <div class="bot-avatar">🤖</div>
        <div class="header-info">
            <h1>AI Chatbot</h1>
            <div class="status">
                <span class="status-dot"></span>
                Online
            </div>
        </div>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages">
        <div class="time-stamp">Today</div>
        <div class="message bot">
            <div class="msg-avatar">🤖</div>
            <div class="bubble">Hello! I'm your AI chatbot. Ask me anything — type <strong>bye</strong> to exit.</div>
        </div>
    </div>

    <!-- Typing indicator -->
    <div class="typing-indicator" id="typingIndicator" style="display:none; padding: 0 20px 12px;">
        <div class="msg-avatar">🤖</div>
        <div class="typing-dots">
            <span></span><span></span><span></span>
        </div>
    </div>

    <!-- Input -->
    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="messageInput" placeholder="Type a message…" autocomplete="off" />
            <button id="sendBtn" aria-label="Send message">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>
</div>

<script>
    const messagesEl = document.getElementById('messages');
    const input = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingEl = document.getElementById('typingIndicator');

    function scrollToBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;

        const avatar = document.createElement('div');
        avatar.className = 'msg-avatar';
        avatar.textContent = sender === 'bot' ? '🤖' : '👤';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;

        div.appendChild(avatar);
        div.appendChild(bubble);
        messagesEl.appendChild(div);
        scrollToBottom();
    }

    function showTyping() {
        typingEl.style.display = 'flex';
        scrollToBottom();
    }

    function hideTyping() {
        typingEl.style.display = 'none';
    }

    async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        input.value = '';
        sendBtn.disabled = true;
        showTyping();

        try {
            const res = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            const data = await res.json();

            // Small delay to feel natural
            setTimeout(() => {
                hideTyping();
                addMessage(data.reply, 'bot');
                sendBtn.disabled = false;
                input.focus();
            }, 400 + Math.random() * 300);

        } catch (err) {
            hideTyping();
            addMessage('Sorry, something went wrong. Please try again.', 'bot');
            sendBtn.disabled = false;
            input.focus();
        }
    }

    sendBtn.addEventListener('click', sendMessage);

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    input.focus();
</script>

</body>
</html>
